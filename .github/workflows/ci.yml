name: CI

# ---------------------------------------------------------------------------
# Package manager: npm workspaces + Turborepo.
#
# This workflow previously assumed pnpm (`pnpm install --frozen-lockfile`,
# `pnpm test:unit`, …). The repository has never had a `pnpm-lock.yaml` — it has
# `package-lock.json` and npm workspaces — so every job failed before it ran a
# single check. A CI pipeline that cannot start is worse than no pipeline: it
# reads as "tests exist and pass".
#
# If the project later moves to pnpm, change BOTH the install step and the
# lockfile in the same commit, and verify `pnpm install --frozen-lockfile`
# succeeds locally first.
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Stage 1 — static analysis. Fastest feedback, fails earliest.
  #
  # `no-explicit-any` is not a separate step: it is configured as an *error* in
  # backend/.eslintrc.cjs, so the Lint step already fails on it. A second gate
  # over the same rule would only be a second thing to keep in sync.
  # ─────────────────────────────────────────────────────────────
  static:
    name: Lint · Typecheck · Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # The backend consumes built output from the shared packages.
      - name: Build shared packages
        run: npm run build:shared

      # Every workspace, not just the backend. Turborepo builds each workspace's
      # dependencies before linting or typechecking it (`dependsOn: ["^build"]` in
      # turbo.json), so the client apps see built shared packages without a
      # hand-ordered build step here.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Enforce module boundaries
        run: npm run check:module-boundaries

  # ─────────────────────────────────────────────────────────────
  # Stage 2 — security. Runs in parallel with the tests.
  # ─────────────────────────────────────────────────────────────
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Blocks on high/critical, with exceptions made explicit and time-boxed in
      # scripts/check-audit.mjs rather than by lowering the threshold. A plain
      # `npm audit --audit-level=high` cannot be used here: it goes red on
      # transitive advisories that have no fix, and its suggested remediation for
      # the multer findings is a downgrade of @nestjs/core to v7.
      - name: Dependency audit
        run: npm run check:audit

      - name: SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/typescript
            p/owasp-top-ten

  # ─────────────────────────────────────────────────────────────
  # Stage 3 — every test suite, then the coverage gate.
  #
  # Not "unit tests" any more. The Phase 1 services are transaction-and-locking
  # code whose behaviour is PostgreSQL's — `OrderService.place` locks rows,
  # reserves stock and writes history — so they are exercised by the
  # database-backed suites, and measuring the unit suite alone reported them as
  # 0% covered. The floor had been set before those files existed, so the gate
  # failed for a reason that had nothing to do with quality. Hence the service
  # container.
  #
  # The floor is a ratchet against regression, not a quality claim: the job is
  # here to stop the number going DOWN unnoticed.
  # ─────────────────────────────────────────────────────────────
  test-unit:
    name: Tests + coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medichain
          POSTGRES_PASSWORD: medichain
          POSTGRES_DB: medichain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medichain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Required by the idempotency suite, which asserts the store's atomic
      # claim against a real server rather than a stub. The application itself
      # treats Redis as optional (ADR-014), so this is a test requirement and
      # not an application one.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://medichain:medichain@127.0.0.1:5432/medichain?schema=public
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build shared packages
        run: npm run build:shared

      # `seedPlatformSettings` encrypts the SECRET rows of `platform_setting` at
      # rest, so the seed needs a keyring key. This job had never got past
      # "Migrate and seed" without one: `prisma db seed` exited 1 inside
      # `buildKeyring`, and because GitHub skips the steps after a failed one,
      # Tests, the coverage gate and the entire Build job never ran either. The
      # pipeline was red for a reason that looked like a test failure and was not.
      #
      # It stayed hidden because it is invisible locally: `backend/.env` supplies
      # the key and Prisma Client loads that file itself. CI has no `.env` by
      # design — `ignoreEnvFile` in `src/config/app-config.module.ts`.
      #
      # Generated, not committed. A literal here is a test fixture rather than a
      # secret, but secret scanning cannot tell the difference — `generic-api-key`
      # flags it — and teaching the scanner to ignore this file is the wrong
      # repair. Nothing needs the value to persist: the database it protects is
      # created from empty on every run.
      - name: Provide a throwaway encryption key
        run: |
          KEY=$(node -p "require('crypto').randomBytes(32).toString('base64')")
          echo "ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"

      # The database-backed suites fail loudly rather than skipping when their
      # fixtures are absent, so this step is what makes them run rather than a
      # convenience.
      - name: Migrate and seed the test database
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Tests
        run: npm run test:all --workspace=@medichain/backend

      - name: Enforce coverage floors
        run: npm run check:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage/

  # ─────────────────────────────────────────────────────────────
  # Stage 4 — build.
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [static, test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

      # Generates the committed API contract from the compiled application. It
      # needs a valid environment but no infrastructure: the app is created
      # without running its lifecycle hooks, so Postgres is never contacted —
      # see `backend/src/scripts/generate-openapi.ts`. `NODE_ENV=test` is used
      # because the production-only rules in the env schema describe a *running*
      # service, not a spec generator.
      - name: Generate OpenAPI document
        run: npm run openapi:generate
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://medichain:medichain@localhost:5432/medichain
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef
          ENCRYPTION_KEY: MGGQIhXCkPTloJSVzwX1xcEmjSRZpDSlA08FH1f4RVs=

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.json

      # The committed contract and the generated client must both match the code.
      # Without this check, a controller change that was never regenerated ships as
      # a client/API mismatch — and that failure surfaces at runtime, in
      # production, as an `undefined` rather than as a red build.
      - name: Regenerate the API client and check for contract drift
        run: |
          npm run api-client:generate
          git diff --exit-code -- \
            backend/openapi.json \
            packages/api-client/src/generated/schema.ts

      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile -t medichain-backend:${{ github.sha }} .

      - name: Container scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: medichain-backend:${{ github.sha }}
          format: sarif
          exit-code: "1"
          # CRITICAL only. The npm-audit gate (scripts/check-audit.mjs) already
          # enforces HIGH at the dependency level and accepts only the multer
          # advisories; the container scan's job is to catch critical issues in
          # the built image (incl. OS packages) that npm audit cannot see.
          severity: CRITICAL
          ignore-unfixed: true
          # Accepted-risk list mirrors .trivyignore: the only CRITICAL is a
          # base-image npm-CLI `tar` DoS (CVE-2026-59873) that is unreachable
          # from the runtime; the multer HIGHs are handled by the audit gate.
          trivyignores: .trivyignore

  # ─────────────────────────────────────────────────────────────
  # PARKED — not yet implemented.
  #
  # These suites are deliberately absent from this workflow rather than
  # present-and-failing, so that a red build always means a real regression.
  #
  # `test-integration`, `test-concurrency` and `test-isolation` all have specs
  # now and run inside the `test-unit` job above, which invokes `npm run
  # test:all` — see the `roots` and `testRegex` in `backend/jest.all.config.js`.
  # They are no longer parked. What is still owed:
  #
  #   test-concurrency  → the remaining Phase 2 money-path cases: no
  #                       credit-limit breach, no double-credit on webhook
  #                       redelivery, ledger balance equals ledger sum, stock
  #                       ledger invariant, advisory-locked cron runs exactly
  #                       once. The oversell case is covered today.
  #   contract          → Phase 1. The OpenAPI diff + regenerated client are now
  #                       enforced in the Build job; a dedicated contract job
  #                       (breaking-change detection, consumer-driven tests) is
  #                       still owed.
  #   test-e2e          → the config exists and no specs do.
  # ─────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────
  # Gate — a single required status check for branch protection.
  # ─────────────────────────────────────────────────────────────
  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    if: always()
    needs: [static, security, test-unit, build]
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All CI gates passed."

  # ─────────────────────────────────────────────────────────────
  # Stage 5 — deploy to dev. Push to `main` only, after every other job passes.
  #
  # ## Why this job is gated on configuration
  #
  # The estate it deploys to (a `dev` Postgres and cluster) is provisioned with
  # a later environment setup, so `DEV_DATABASE_URL` and `KUBE_CONFIG` do not
  # exist yet. Until they do, the job reports exactly what is missing and
  # succeeds. A deploy job that is red on every push for a reason no one can fix
  # in code is a deploy job everyone learns to ignore — and then a real failure
  # in it is invisible.
  #
  # Migrations run **before** the new image is rolled out, per docs/14 §2: the
  # new version must never meet a schema it does not understand. They are written
  # to be backward compatible so the previous version keeps working during the
  # window between the two steps, which is also what makes rollback possible.
  # ─────────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: [ci-complete]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: dev
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/backend
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy configuration
        id: config
        run: |
          if [ -n "$DEV_DATABASE_URL" ] && [ -n "$KUBE_CONFIG" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy to dev skipped::DEV_DATABASE_URL and KUBE_CONFIG are not set in the 'dev' environment. Add them to enable the deploy."
          fi

      - name: Build and push image
        if: steps.config.outputs.configured == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f infra/docker/backend.Dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:dev" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:dev"

      - name: Run migrations
        if: steps.config.outputs.configured == 'true'
        run: |
          npm ci
          DATABASE_URL="$DEV_DATABASE_URL" npm run db:migrate

      - name: Roll out
        if: steps.config.outputs.configured == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          kubectl -n medichain-dev set image deployment/backend "backend=$IMAGE:${{ github.sha }}"
          kubectl -n medichain-dev rollout status deployment/backend --timeout=120s
